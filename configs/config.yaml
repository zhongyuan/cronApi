# ============================================================
# cronApi 运行配置（生产可用环境变量覆盖，见 README「配置」章节）
# 优先级：环境变量 > 配置文件 > 内置默认值
# ============================================================
app:
  name: cronApi
  env: dev            # dev | test | prod
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 15s

log:
  level: info         # debug | info | warn | error
  format: console     # console | json
  output: stdout      # stdout | 文件路径

mysql:
  enabled: false      # 联调任务/报告建议开 MySQL；纯跑用例可关闭
  host: 127.0.0.1
  port: 3306
  user: root
  password: ""
  database: cron_api
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  slow_threshold: 200ms

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0
  pool_size: 50
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  # enabled=false 时使用内存版缓存/会话存储（仅限本地调试、单实例）

jwt:
  # 请在生产环境通过环境变量 JWT_SECRET 覆盖
  secret: "change-me-in-prod-please-use-a-32+byte-secret"
  issuer: cronApi
  access_ttl: 2h
  refresh_ttl: 168h   # 7 天

wechat:
  app_id: ""
  app_secret: ""
  # mock=true 时不请求微信服务器，直接按 openid 规则生成（本地联调用）
  mock: true
  endpoint: "https://api.weixin.qq.com"
  timeout: 5s

scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  # 同时执行的任务上限，防止压垮被测服务
  max_concurrency: 8

http_client:
  timeout: 15s
  max_idle_conns: 200
  # 联调时被测服务常使用自签证书
  insecure_skip_verify: false
